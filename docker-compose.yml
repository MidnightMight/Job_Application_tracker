services:
  app:
    # build: . builds from local source. Remove or comment it out and run
    # "docker compose pull && docker compose up -d" to pull a pre-built image
    # from the GitHub Container Registry instead (e.g. when updating).
    build: .
    image: ghcr.io/midnightmight/job_application_tracker:latest
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    environment:
      # The app runs as this user/group and takes ownership of ./data on start.
      # Use your own IDs (run `id` on the host) to keep the files easy to manage.
      - PUID=1000
      - PGID=1000
      - PORT=5000
      - DB_PATH=/data/jobs.db
      # Optional: left empty, a session key is generated and saved in
      # ./data/secret_key. An existing SECRET_KEY (e.g. from .env) still wins.
      - SECRET_KEY=${SECRET_KEY:-}
